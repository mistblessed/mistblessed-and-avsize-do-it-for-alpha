[project]
name = "alfa-pii"
version = "0.1.0"
description = "CPU-only personal data protection proxy for AlfaGen"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1",
  "redis>=5,<7", "cryptography>=43", "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.6,<3", "pyyaml>=6,<7", "natasha==1.6.0",
  "setuptools<81", "regex>=2024.11", "numpy<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "hypothesis>=6,<7", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML", "locust>=2.32,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alfa_pii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["redis: requires TEST_REDIS_URL pointing at a disposable real Redis", "ner: exercises local Natasha weights", "slow: long input or process integration"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/alfa_pii"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
